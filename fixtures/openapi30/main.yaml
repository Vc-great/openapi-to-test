openapi: 3.0.3
info:
  title: Consumer Acceptance API
  version: 1.0.0
servers:
  - url: https://example.test
paths:
  /users/{userId}:
    get:
      tags: [users]
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: verbose
          in: query
          required: false
          schema: { type: boolean }
        - name: X-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: session
          in: cookie
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unknown error
          content:
            application/json:
              schema: {}
  /users:
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "204":
          description: No content
  /media-without-schema:
    get:
      tags: [misc]
      operationId: getSchemaLessMedia
      responses:
        "200":
          description: Unknown body
          content:
            application/json: {}
components:
  schemas:
    Role:
      type: string
      enum: [admin, member]
    Address:
      type: object
      required: [city]
      properties:
        city: { type: string }
        zip: { type: string, nullable: true }
    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        address:
          $ref: "#/components/schemas/Address"
        optionalInline:
          type: object
          required: [count]
          properties:
            count: { type: number }
            mode:
              type: string
              enum: [fast, slow]
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
    CreateUser:
      allOf:
        - type: object
          required: [name]
          properties:
            name: { type: string }
        - type: object
          properties:
            choice:
              oneOf:
                - { type: string }
                - { type: integer }
            flexible:
              anyOf:
                - { type: boolean }
                - { type: string, nullable: true }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: integer }
    TreeNode:
      type: object
      required: [value]
      properties:
        value: { type: string }
        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
