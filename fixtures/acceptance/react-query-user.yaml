openapi: 3.0.3
info:
  title: React Query Strict Compile Acceptance API
  version: 1.0.0
paths:
  /users/{userId}:
    get:
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: verbose
          in: query
          required: false
          schema: { type: boolean }
        - name: X-Tenant
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          description: Missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
